[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shellhist-scrub"
version = "1.1.0"
description = "Find and mask passwords, tokens and credentials typed into your zsh, bash or fish history. Atomic scrubbing, JSON report."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["shell-history", "zsh", "bash", "secrets"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/shellhist-scrub"

[project.scripts]
shellhist-scrub = "shellhist_scrub:main"

[tool.setuptools]
py-modules = ["shellhist_scrub"]
